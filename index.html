<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gestão de Atividades Pessoal</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#66728a;--bd:#dde3ee;--pri:#1f5fbf;--pri2:#e8f0fd;--ok:#188a4b;--warn:#c77a00;--bad:#c62f3d;--side:#14213d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1522;--card:#18202f;--tx:#e6ebf5;--mut:#93a0b8;--bd:#2a3550;--pri:#5b9bff;--pri2:#1d2d4d;--ok:#3ec27a;--warn:#e8a33d;--bad:#ef6a75;--side:#0b1020}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1522;--card:#18202f;--tx:#e6ebf5;--mut:#93a0b8;--bd:#2a3550;--pri:#5b9bff;--pri2:#1d2d4d;--ok:#3ec27a;--warn:#e8a33d;--bad:#ef6a75;--side:#0b1020}
:root[data-theme=light]{color-scheme:light;--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#66728a;--bd:#dde3ee;--pri:#1f5fbf;--pri2:#e8f0fd;--ok:#188a4b;--warn:#c77a00;--bad:#c62f3d;--side:#14213d}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mut)}
.tag.warn{background:#fff1d6;color:var(--warn)}.pt{margin:4px 0;font-size:13px}.pt b{color:var(--mut);font-weight:600}.sg{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--bd);flex-wrap:wrap}.sg .m{flex:1;min-width:200px}
@media print{.side,.top,.acoes,.btn,#mod{display:none!important}#c{padding:0}.card{break-inside:avoid}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:210px;background:var(--side);color:#cdd6ea;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;color:#fff;padding:4px 8px 14px;font-size:15px}
.nav button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav button:hover{background:#ffffff14}.nav button.on{background:#ffffff24;color:#fff;font-weight:600}
.grow{flex:1}.ver{font-size:11px;padding:6px 8px;color:#8c99b5}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{margin:0;font-size:18px;flex:1}
#c{padding:18px 20px 60px;max-width:1200px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.grid2 .card{margin:0}
.btn{background:var(--pri);color:#fff;border:0;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .m{flex:1;min-width:0}.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--mut);font-size:12px}.row.feito .t{text-decoration:line-through;color:var(--mut)}
.row.click{cursor:pointer}.row.click:hover{background:var(--pri2)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--pri2);color:var(--pri)}
.tag.alta{background:#fff1d6;color:var(--warn)}.tag.urgente{background:#fde3e5;color:var(--bad)}.tag.ok{background:#dff5e8;color:var(--ok)}.tag.bad{background:#fde3e5;color:var(--bad)}
.vazio{color:var(--mut);padding:8px 2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select,.f input,.f select,.f textarea{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 9px}
.bar input{min-width:200px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:50}
.mod{background:var(--card);border-radius:14px;max-width:720px;width:100%;padding:18px 20px;box-shadow:0 20px 60px #0006}
.mod h3{margin:0 0 12px}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.f .full{grid-column:1/-1}.f textarea{min-height:70px;resize:vertical}.f input,.f select,.f textarea{width:100%}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.foot .esq{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.cl{display:flex;gap:8px;align-items:center;padding:3px 0}.cl input[type=text]{flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:10px;z-index:99;max-width:90%}
.cal-h{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.cal-h b{font-size:16px;flex:1;min-width:160px}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.mes .dn{background:var(--card);padding:4px 6px;font-size:11px;color:var(--mut);text-align:center;font-weight:600}
.mes .d{background:var(--card);min-height:92px;padding:3px;cursor:pointer;overflow:hidden}.mes .d.fora{opacity:.45}.mes .d.hj{background:var(--pri2)}
.mes .d b{font-size:12px;display:block;margin:0 3px 2px}
.ch{display:block;font-size:11px;padding:1px 5px;margin:1px 0;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:#e3e8f2;color:#2a3550}
.ch.t-email{background:#dbe8ff;color:#1b4c9c}.ch.t-ligacao{background:#d9f3e4;color:#15683a}.ch.t-mensagem{background:#d5f1f0;color:#0f6663}
.ch.t-visita{background:#ffe9cc;color:#8a4f00}.ch.t-reuniao{background:#ebdcff;color:#5b2aa3}.ch.t-tarefa{background:#e3e8f2}.ch.feito{text-decoration:line-through;opacity:.6}
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.sem .col{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;min-height:140px}
.sem .col h4{margin:0 0 6px;font-size:12px;color:var(--mut)}.sem .col.hj{border-color:var(--pri)}
#bk{font-size:12px}.bk-ok{color:var(--ok)}.bk-av{color:var(--warn)}
.sug{display:flex;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.sug:last-child{border:0}.sug .m{flex:1;min-width:200px}
textarea.big{width:100%;min-height:160px;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:9px}
@media(max-width:800px){.app{flex-direction:column}.side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:4px 6px;z-index:30;border-top:1px solid #ffffff22}.brand,.ver,.grow{display:none}.nav{display:flex;width:100%}.nav button{flex-direction:column;gap:0;font-size:10px;padding:6px 6px;flex:1;white-space:nowrap;align-items:center}.nav button span{font-size:18px}#c{padding:12px 12px 90px}.top{padding:10px 12px}.top h2{font-size:16px}.sem{grid-template-columns:1fr}.f{grid-template-columns:1fr}.mes .d{min-height:58px}.ch{font-size:10px}.bar input{min-width:0;flex:1 1 100%}.ov{padding:0}.mod{border-radius:0;min-height:100vh}.btn{padding:9px 14px}.btn.sm{padding:6px 10px}.toast{bottom:80px}.foot{position:sticky;bottom:0;background:var(--card);padding:10px 0;margin-bottom:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">📋 Minhas Atividades</div>
    <nav class="nav" id="nav"></nav>
    <div class="grow"></div>
    <div class="ver" id="ver"></div>
  </aside>
  <main>
    <header class="top"><h2 id="tit"></h2><div id="bk"></div><button class="btn sec sm" id="tema" data-a="tema" title="Alternar modo claro/escuro"></button></header>
    <section id="c"></section>
  </main>
</div>
<div id="mod"></div>
<script>
(function(){
'use strict';
const VERSAO='v1.2.0',DATA_VERSAO='06/11/2026';
const MAX_ARQ=15*1024*1024, MAX_TOTAL=300*1024*1024;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- datas ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const hoje=()=>ymd(new Date());
const addDias=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtData=s=>s?s.split('-').reverse().join('/'):'';
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const segunda=s=>{const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const somaHora=(h,min)=>{const p=h.split(':').map(Number);let t=p[0]*60+p[1]+min;if(t>=1440)t=1439;return pad(Math.floor(t/60))+':'+pad(t%60)};

/* ---------- tipos ---------- */
const TIPOS=[['email_ler','✉️','E-mail — ler'],['email_resp','✉️','E-mail — responder'],['email_env','✉️','E-mail — enviar'],['ligacao','📞','Ligação'],['mensagem','💬','Mensagem'],['visita','🚗','Visita'],['reuniao_remota','💻','Reunião remota'],['reuniao_presencial','🤝','Reunião presencial'],['tarefa','✅','Tarefa']];
const TIPO={};TIPOS.forEach(t=>TIPO[t[0]]={ic:t[1],nome:t[2]});
const EVENTOS=['visita','reuniao_remota','reuniao_presencial'];
const ehEvento=t=>EVENTOS.indexOf(t)>=0;
const grupo=t=>t.indexOf('email')===0?'email':t.indexOf('reuniao')===0?'reuniao':t;
const PRIO={normal:'Normal',alta:'Alta',urgente:'Urgente'};
const STATUS={pendente:'Pendente',andamento:'Em andamento',concluida:'Concluída'};

/* ---------- estado ---------- */
let S={versao:1,atividades:[],notas:[],contas:[],excluidos:{},excluidosAnexos:{},config:{dispensadas:{}}};
let L={pastaNome:'',clientId:'',driveOn:false,fileId:'',folderId:'',ultimoSync:null};
const U={tela:'hoje',cal:{modo:'mes',ref:hoje()},fa:{q:'',tipo:'',status:'',prazo:'',cliente:''},fn:{q:''}};
function normaliza(d){d=d||{};const c=Object.assign({},d.config||{});return{versao:1,atividades:Array.isArray(d.atividades)?d.atividades:[],notas:Array.isArray(d.notas)?d.notas:[],contas:Array.isArray(d.contas)?d.contas:[],excluidos:Object.assign({},d.excluidos||{}),excluidosAnexos:Object.assign({},d.excluidosAnexos||{}),config:{dispensadas:Object.assign({},c.dispensadas||{})}}}
const tocar=o=>{o.atualizadoEm=new Date().toISOString()};

/* ---------- IndexedDB ---------- */
let DB=null;
function abreDB(){return new Promise((ok,err)=>{const r=indexedDB.open('atv_pessoal',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');const a=d.createObjectStore('anexos',{keyPath:'id'});a.createIndex('atvId','atvId')};
  r.onsuccess=()=>{DB=r.result;ok()};r.onerror=()=>err(r.error)})}
function tx(store,modo,fn){return new Promise((ok,err)=>{const t=DB.transaction(store,modo);const s=t.objectStore(store);let res;
  const rq=fn(s);if(rq)rq.onsuccess=()=>{res=rq.result};t.oncomplete=()=>ok(res);t.onerror=()=>err(t.error);t.onabort=()=>err(t.error)})}
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvPut=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const anexoPut=a=>tx('anexos','readwrite',s=>s.put(a));
const anexoDel=id=>tx('anexos','readwrite',s=>s.delete(id));
const anexoAll=()=>tx('anexos','readonly',s=>s.getAll());
const anexoDe=id=>tx('anexos','readonly',s=>s.index('atvId').getAll(id));
const anexoLimpa=()=>tx('anexos','readwrite',s=>s.clear());

/* ---------- pasta de backup (File System Access) ---------- */
let dirHandle=null,dirStatus='nenhuma',dirErro='',ultimoSalvo=null,fila=Promise.resolve(),timer=null;
const suportaPasta=()=>typeof window.showDirectoryPicker==='function';
const nomeArq=a=>a.id.slice(0,8)+'_'+String(a.nome).replace(/[\\/:*?"<>|]/g,'_');
async function carregaHandle(){
  if(!suportaPasta()){dirStatus='nao_suportado';return}
  try{const h=await kvGet('handle');if(h){dirHandle=h;const p=await h.queryPermission({mode:'readwrite'});dirStatus=p==='granted'?'ok':'permissao'}}catch(e){}
}
async function escreve(dir,nome,conteudo){const fh=await dir.getFileHandle(nome,{create:true});const w=await fh.createWritable();await w.write(conteudo);await w.close()}
async function gravaPasta(){
  if(!dirHandle||dirStatus!=='ok')return;
  try{
    const anexos=await anexoAll();let sub=null;
    for(const a of anexos){if(!a.gravado&&a.blob){sub=sub||await dirHandle.getDirectoryHandle('anexos',{create:true});await escreve(sub,nomeArq(a),a.blob);a.gravado=true;await anexoPut(a)}}
    const meta=anexos.map(a=>({id:a.id,atvId:a.atvId,nome:a.nome,tipo:a.tipo,tamanho:a.tamanho,driveId:a.driveId||null}));
    await escreve(dirHandle,'gestao-atividades.json',JSON.stringify({app:'gestao-atividades-pessoal',versao:VERSAO,exportadoEm:new Date().toISOString(),dados:S,anexos:meta},null,1));
    ultimoSalvo=new Date();dirErro='';
  }catch(e){dirErro=e.message||String(e);if(e.name==='NotAllowedError'||e.name==='SecurityError')dirStatus='permissao'}
  atualizaBk();
}
function agendaGravacao(){clearTimeout(timer);timer=setTimeout(()=>{fila=fila.then(gravaPasta).catch(()=>{})},800)}
async function removeArqPasta(a){if(!dirHandle||dirStatus!=='ok')return;try{const sub=await dirHandle.getDirectoryHandle('anexos');await sub.removeEntry(nomeArq(a))}catch(e){}}
async function salvar(){
  try{await kvPut('estado',JSON.parse(JSON.stringify(S)))}catch(e){toast('Erro ao salvar no navegador: '+e.message)}
  agendaGravacao();agendaSync();atualizaBk();
}
async function escolhePasta(){
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite',id:'atv-pessoal'});
    dirHandle=h;dirStatus='ok';L.pastaNome=h.name;salvaL();
    try{await kvPut('handle',h)}catch(e){}
    let existe=false;try{await h.getFileHandle('gestao-atividades.json');existe=true}catch(e){}
    if(existe&&confirm('Esta pasta já tem um backup (gestao-atividades.json).\n\nOK = restaurar os dados desta pasta (substitui os dados atuais).\nCancelar = manter os dados atuais e sobrescrever o backup da pasta.')){await restauraPasta();return}
    await salvar();await gravaPasta();toast('Pasta de backup definida: '+h.name);render();
  }catch(e){if(e.name!=='AbortError')toast('Não foi possível usar a pasta: '+e.message)}
}
async function reativaPasta(){
  try{const p=await dirHandle.requestPermission({mode:'readwrite'});dirStatus=p==='granted'?'ok':'permissao';if(dirStatus==='ok'){await gravaPasta();toast('Gravação na pasta reativada')}}catch(e){toast('Erro: '+e.message)}
  atualizaBk();if(U.tela==='backup')render();
}
async function restauraPasta(){
  try{
    const fh=await dirHandle.getFileHandle('gestao-atividades.json');const j=JSON.parse(await(await fh.getFile()).text());
    if(!j||!j.dados)throw new Error('Arquivo de backup inválido');
    await anexoLimpa();let sub=null;try{sub=await dirHandle.getDirectoryHandle('anexos')}catch(e){}
    const faltam=[];
    for(const m of (j.anexos||[])){try{const f=await(await sub.getFileHandle(nomeArq(m))).getFile();await anexoPut({id:m.id,atvId:m.atvId,nome:m.nome,tipo:m.tipo,tamanho:m.tamanho,blob:f,gravado:true,driveId:m.driveId||null,criadoEm:new Date().toISOString()})}catch(e){faltam.push(m.nome)}}
    S=normaliza(j.dados);
    await kvPut('estado',JSON.parse(JSON.stringify(S)));
    toast('Dados restaurados da pasta'+(faltam.length?' (anexos ausentes: '+faltam.length+')':''));render();atualizaBk();
  }catch(e){toast('Falha ao restaurar: '+e.message)}
}

/* ---------- sincronização com o Google Drive ---------- */
const CLIENT_ID_PADRAO='238323388228-o3p0n5dm8377ndr1dpq35gor6h6krj4r.apps.googleusercontent.com';
const ESCOPO='https://www.googleapis.com/auth/drive.file';
const PASTA_NOME='Gestão de Atividades (app)',ARQ_NOME='gestao-atividades.json';
const DRV='https://www.googleapis.com/drive/v3/files',UP='https://www.googleapis.com/upload/drive/v3/files';
const clientId=()=>L.clientId||CLIENT_ID_PADRAO;
let driveStatus='desligado',driveErro='',token=null,tokenExp=0,tokenCli=null,tokenCid='',tokenPend=null,sincTrab=false,sincPend=false,syncTimer=null,driveIniciado=false;
async function salvaL(){try{await kvPut('local',JSON.parse(JSON.stringify(L)))}catch(e){}}
async function removeAnexo(x){
  await anexoDel(x.id);removeArqPasta(x);
  S.excluidosAnexos[x.id]={ts:new Date().toISOString(),driveId:x.driveId||null};
}
function carregaGsi(){return new Promise((ok,err)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2)return ok();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
  s.onload=()=>ok();s.onerror=()=>err(new Error('Sem acesso ao Google. Verifique a internet.'));document.head.appendChild(s)})}
function pedeToken(){
  return new Promise((ok,err)=>{
    carregaGsi().then(()=>{
      if(!tokenCli||tokenCid!==clientId()){
        tokenCli=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:ESCOPO,
          callback:r=>{const p=tokenPend;tokenPend=null;if(!p)return;
            if(r&&r.access_token){token=r.access_token;tokenExp=Date.now()+((+r.expires_in||3600)-60)*1000;p.ok(token)}
            else p.err(new Error('reauth:'+((r&&r.error)||'negado')))},
          error_callback:e=>{const p=tokenPend;tokenPend=null;if(p)p.err(new Error('reauth:'+((e&&e.type)||'erro')))}});
        tokenCid=clientId();
      }
      tokenPend={ok,err};tokenCli.requestAccessToken({prompt:''});
    }).catch(err);
  });
}
function pedeTokenSeFalta(){return(token&&Date.now()<tokenExp)?Promise.resolve(token):pedeToken()}
const tokenValido=()=>!!token&&Date.now()<tokenExp;
async function gapi(url,opt){
  opt=opt||{};const t=await pedeTokenSeFalta();
  const h=Object.assign({},opt.headers||{},{Authorization:'Bearer '+t});
  const r=await fetch(url,Object.assign({},opt,{headers:h}));
  if(r.status===401){token=null;throw new Error('reauth:401')}
  if(!r.ok){let m='';try{m=(await r.text()).slice(0,160)}catch(e){}throw new Error('Drive '+r.status+(m?': '+m:''))}
  return r;
}
async function achaPorNome(nome,pai,pasta){
  const q="name='"+nome.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"' and trashed=false"+(pasta?" and mimeType='application/vnd.google-apps.folder'":'')+(pai?" and '"+pai+"' in parents":'');
  const r=await gapi(DRV+'?q='+encodeURIComponent(q)+'&fields='+encodeURIComponent('files(id,name,modifiedTime)')+'&pageSize=10&orderBy=createdTime');
  const j=await r.json();return(j.files&&j.files[0])||null;
}
async function garantePasta(){
  if(L.folderId)return L.folderId;
  let f=await achaPorNome(PASTA_NOME,null,true);

/* mesclagem: vale o registro alterado por último; exclusões usam marcas (tombstones) */
const ts=o=>(o&&(o.atualizadoEm||o.criadoEm))||'';
const byId=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
function estavel(o){
  if(Array.isArray(o))return'['+o.map(estavel).join(',')+']';
  if(o&&typeof o==='object')return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+estavel(o[k])).join(',')+'}';
  const j=JSON.stringify(o);return j===undefined?'null':j;
}
const dadosSync=x=>({atividades:x.atividades.slice().sort(byId),notas:x.notas.slice().sort(byId),contas:x.contas.slice().sort(byId),excluidos:x.excluidos,excluidosAnexos:x.excluidosAnexos,config:{dispensadas:x.config.dispensadas}});
function mesclaLista(la,lb,exc){
  const m=new Map();la.concat(lb).forEach(o=>{if(!o||!o.id)return;const c=m.get(o.id);if(!c||ts(o)>ts(c))m.set(o.id,o)});
  return Array.from(m.values()).filter(o=>!(exc[o.id]&&exc[o.id]>=ts(o)));
}
function mescla(a,b){
  const r=normaliza({});
  r.excluidos=Object.assign({},a.excluidos);Object.keys(b.excluidos).forEach(k=>{r.excluidos[k]=(r.excluidos[k]||'')>b.excluidos[k]?r.excluidos[k]:b.excluidos[k]});
  r.excluidosAnexos=Object.assign({},b.excluidosAnexos,a.excluidosAnexos);
  r.atividades=mesclaLista(a.atividades,b.atividades,r.excluidos);
  r.notas=mesclaLista(a.notas,b.notas,r.excluidos);
  r.contas=mesclaLista(a.contas,b.contas,r.excluidos);
  r.config.dispensadas=Object.assign({},b.config.dispensadas,a.config.dispensadas);
  return r;
}
async function sincroniza(){
  if(!L.driveOn||!clientId()||!navigator.onLine)return;
  if(sincTrab){sincPend=true;return}
  sincTrab=true;driveStatus='sincronizando';driveErro='';atualizaBk();
  let alterou=false;
  try{
    const pasta=await garantePasta();
    let fid=L.fileId;
    if(!fid){const f=await achaPorNome(ARQ_NOME,pasta,false);if(f)fid=f.id}
    let remoto=null;
    if(fid){try{remoto=await(await gapi(DRV+'/'+fid+'?alt=media')).json()}catch(e){if(/^Drive 404/.test(e.message)){fid=null;L.fileId=''}else throw e}}
    const rd=normaliza(remoto&&remoto.dados);
    const antes=estavel(dadosSync(S));
    S=mescla(S,rd); /* sem await entre a mesclagem e a troca do estado */
    if(estavel(dadosSync(S))!==antes)alterou=true;
    const rmeta=Array.isArray(remoto&&remoto.anexos)?remoto.anexos:[];
    const ids=new Set(S.atividades.map(a=>a.id));
    let locais=await anexoAll();const mapa=new Map(locais.map(x=>[x.id,x]));
    for(const m of rmeta){
      if(S.excluidosAnexos[m.id]||!ids.has(m.atvId))continue;
      const l=mapa.get(m.id);
      if(!l){await anexoPut({id:m.id,atvId:m.atvId,nome:m.nome,tipo:m.tipo,tamanho:m.tamanho,driveId:m.driveId||null,criadoEm:m.criadoEm||'',blob:null,gravado:true});alterou=true}
      else if(!l.driveId&&m.driveId){l.driveId=m.driveId;await anexoPut(l)}
    }
    for(const id of Object.keys(S.excluidosAnexos)){
      const l=mapa.get(id);if(l){await anexoDel(id);removeArqPasta(l);alterou=true}
      const t=S.excluidosAnexos[id];
      if(t&&t.driveId&&!t.apagado){
        try{await gapi(DRV+'/'+t.driveId,{method:'DELETE'})}catch(e){if(/^reauth/.test(e.message))throw e}
        t.apagado=true;
      }
    }
    locais=await anexoAll();
    for(const l of locais){
      if(S.excluidosAnexos[l.id]||!ids.has(l.atvId)||l.driveId||!l.blob)continue;
      l.driveId=await enviaArq(null,{name:nomeArq(l),parents:[pasta]},l.blob,l.tipo||'application/octet-stream');
      await anexoPut(l);
    }
    locais=await anexoAll();
    const meta=locais.filter(l=>!S.excluidosAnexos[l.id]&&ids.has(l.atvId)).map(l=>({id:l.id,atvId:l.atvId,nome:l.nome,tipo:l.tipo,tamanho:l.tamanho,driveId:l.driveId||null,criadoEm:l.criadoEm||''})).sort(byId);
    const igual=remoto&&estavel(dadosSync(normaliza(remoto.dados)))===estavel(dadosSync(S))&&estavel(rmeta.slice().sort(byId))===estavel(meta);
    if(!igual){
      const payload={app:'gestao-atividades-pessoal',versao:VERSAO,atualizadoEm:new Date().toISOString(),dados:dadosSync(S),anexos:meta};
      fid=await enviaArq(fid,fid?{name:ARQ_NOME}:{name:ARQ_NOME,parents:[pasta]},JSON.stringify(payload),'application/json');
    }
    L.fileId=fid;L.ultimoSync=new Date().toISOString();await salvaL();
    await kvPut('estado',JSON.parse(JSON.stringify(S)));
    driveStatus='ok';
  }catch(e){
    const m=(e&&e.message)||String(e);
    if(/^reauth/.test(m)){driveStatus='reconectar';driveErro=''}
    else{driveStatus='erro';driveErro=m}
  }finally{
    sincTrab=false;atualizaBk();
    if(alterou||(U.tela==='backup'&&!(document.activeElement&&document.activeElement.tagName==='INPUT')))render();
    if(sincPend){sincPend=false;setTimeout(sincroniza,400)}
  }
}

function temaAtual(){const t=document.documentElement.getAttribute('data-theme');if(t)return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function aplicaTema(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');const b=$('#tema');if(b)b.textContent=temaAtual()==='dark'?'☀️ Modo claro':'🌙 Modo escuro'}

/* ---------- clientes potenciais ---------- */
const ETAPAS={prospect:'Prospecção',contato:'Em contato',proposta:'Proposta',negociacao:'Negociação',ganho:'Ganho',perdido:'Perdido'};
const ATIVAS=['prospect','contato','proposta','negociacao'];
const brl=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const diasEntre=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
function util(d){const x=parseYmd(d);while(x.getDay()===0||x.getDay()===6)x.setDate(x.getDate()+1);return ymd(x)}
function novaConta(p){return Object.assign({id:uid(),nome:'',contato:'',etapa:'prospect',valor:0,freqDias:14,obs:'',criadoEm:new Date().toISOString()},p||{})}
const ehAtiva=c=>ATIVAS.includes(c.etapa);
function atvDaConta(c){const n=norm(c.nome);return S.atividades.filter(a=>norm(a.cliente)===n)}
function notasDaConta(c){const n=norm(c.nome);return S.notas.filter(x=>norm(x.cliente)===n)}
function resumoConta(c){
  const h=hoje(),as=atvDaConta(c),ns=notasDaConta(c);
  const passadas=ordena(as.filter(a=>a.data&&((a.status==='concluida'&&a.data<=h)||(ehEvento(a.tipo)&&a.data<h))));
  const ultAtv=passadas.length?passadas[passadas.length-1]:null;
  const datas=passadas.map(a=>a.data).concat(ns.map(x=>x.data).filter(Boolean)).sort();
  const ultima=datas.length?datas[datas.length-1]:'';
  const futuras=ordena(as.filter(a=>a.status!=='concluida'&&a.data&&a.data>=h));
  const prox=futuras[0]||null,freq=+c.freqDias||14;
  const base=ultima||(c.criadoEm||'').slice(0,10)||h,devido=addDias(base,freq);
  let situ='ok';
  if(!ehAtiva(c))situ='enc';else if(devido<h&&!prox)situ='atrasado';else if(!prox&&devido<=addDias(h,3))situ='atencao';else if(prox)situ='agendado';
  const abertos=[];ns.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,3).forEach(n=>(n.proximos||[]).filter(p=>p.acao).forEach(p=>abertos.push({acao:p.acao,prazo:p.prazo||'',resp:p.resp||'',nota:n.data})));
  return{ultima,ultAtv,prox,futuras,devido,situ,freq,dias:ultima?diasEntre(ultima,h):null,abertos,ns:ns.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')),total:as.length+ns.length};
}
function sugestoesConta(c){
  if(!ehAtiva(c))return[];
  const r=resumoConta(c),h=hoje(),out=[],nome=c.nome;
  const quando=gap=>util(r.situ==='atrasado'?h:(()=>{const d=addDias(r.ultima||h,gap);return d<h?h:d})());
  const tipoU=r.ultAtv?r.ultAtv.tipo:'';
  const tem=t=>r.futuras.some(a=>a.tipo===t);
  const add=(tipo,titulo,gap,motivo,ev)=>{if(tem(tipo)&&!ev)return;out.push({tipo,titulo,data:quando(gap),hora:ev?'10:00':(tipo==='ligacao'?'10:00':''),horaFim:ev?'11:00':'',motivo})};
  if(!r.prox){
    if(c.etapa==='negociacao')add('reuniao_remota','Reunião de fechamento — '+nome,3,'Conta em negociação: alinhar pendências e condições finais.',true);
    else if(c.etapa==='proposta')add('ligacao','Follow-up da proposta — '+nome,3,'Proposta enviada: confirmar recebimento, dúvidas e prazo de decisão.');
    else if(!r.ultAtv)add('email_env','Apresentação inicial — '+nome,0,'Sem histórico: iniciar o relacionamento com uma apresentação.');
    else if(['email_env','mensagem','email_resp','email_ler'].includes(tipoU))add('ligacao','Ligar para '+nome+' e validar interesse',2,'Último contato foi por escrito ('+TIPO[tipoU].nome+'): reforçar por voz.');
    else if(tipoU==='ligacao')add('reuniao_remota','Reunião de descoberta — '+nome,3,'Após a ligação, aprofundar necessidades em reunião.',true);
    else if(['reuniao_remota','reuniao_presencial','visita'].includes(tipoU))add('email_env','Resumo e próximos passos — '+nome,1,'Registrar por escrito o que foi combinado na última '+TIPO[tipoU].nome.toLowerCase()+'.');
    else add('email_env','Retomar contato com '+nome,2,'Manter a frequência de contato (a cada '+r.freq+' dias).');
  }
  r.abertos.filter(p=>p.prazo&&p.prazo>=h||!p.prazo).slice(0,2).forEach(p=>{
    if(S.atividades.some(a=>norm(a.cliente)===norm(nome)&&norm(a.titulo)===norm(p.acao)))return;
    out.push({tipo:'tarefa',titulo:p.acao,data:util(p.prazo&&p.prazo>=h?p.prazo:addDias(h,1)),hora:'',horaFim:'',motivo:'Próximo passo registrado na nota de '+fmtData(p.nota)+(p.resp?' (resp.: '+p.resp+')':'')+'.'});
  });
  if(!r.prox&&!out.length)add('mensagem','Mensagem rápida para '+nome,r.freq,'Manter cadência de contato.');
  return out;
}
const SITU={ok:['Em dia',''],agendado:['Agendado','ok'],atencao:['Atenção','warn'],atrasado:['Follow-up atrasado','bad'],enc:['Encerrada','']};

/* ---------- relatório de oportunidades ---------- */
function dadosRel(){
  const ord={atrasado:0,atencao:1,ok:2,agendado:3};
  return S.contas.filter(ehAtiva).map(c=>({c,r:resumoConta(c),sg:sugestoesConta(c)})).sort((a,b)=>ord[a.r.situ]-ord[b.r.situ]||(+b.c.valor||0)-(+a.c.valor||0));
}
function pontosConta(c,r){
  const n=r.ns[0],p=[];
  if(n){const dec=(n.decisoes||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,2),pt=(n.pontos||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,2);
    if(dec.length)p.push(['Decisões ('+fmtData(n.data)+')',dec.join('; ')]);if(pt.length)p.push(['Pontos discutidos',pt.join('; ')])}
  if(r.abertos.length)p.push(['Passos em aberto',r.abertos.map(x=>x.acao+(x.prazo?' ('+fmtData(x.prazo)+')':'')).join('; ')]);
  if(c.obs)p.push(['Observações',c.obs.split('\n')[0]]);
  return p;
}
function vRel(c){
  const L2=dadosRel(),tot=L2.reduce((s,o)=>s+(+o.c.valor||0),0),atr=L2.filter(o=>o.r.situ==='atrasado').length,sem=L2.filter(o=>!o.r.prox).length;

  +'<div class="kpis"><div class="kpi"><b>'+L2.length+'</b><span>Oportunidades ativas</span></div><div class="kpi"><b>'+brl(tot)+'</b><span>Valor em aberto</span></div><div class="kpi"><b>'+atr+'</b><span>Follow-ups atrasados</span></div><div class="kpi"><b>'+sem+'</b><span>Sem ação agendada</span></div></div>'
  +(L2.length?L2.map(o=>{const c2=o.c,r=o.r,sit=SITU[r.situ],pts=pontosConta(c2,r);
    return '<div class="card"><h3>'+esc(c2.nome)+' <span class="tag">'+ETAPAS[c2.etapa]+'</span><span class="tag '+sit[1]+'">'+sit[0]+'</span>'+(c2.valor?'<span style="margin-left:auto">'+brl(c2.valor)+'</span>':'')+'</h3>'
    +'<div class="pt"><b>Último contato:</b> '+(r.ultima?fmtData(r.ultima)+' ('+r.dias+' dias'+(r.ultAtv?' · '+TIPO[r.ultAtv.tipo].nome:'')+')':'nenhum registrado')+' · <b>Frequência:</b> a cada '+r.freq+' dias</div>'
    +'<div class="pt"><b>Já agendado:</b> '+(r.futuras.length?r.futuras.slice(0,3).map(a=>fmtData(a.data)+(a.hora?' '+a.hora:'')+' '+esc(a.titulo)).join(' | '):'nada')+'</div>'
    +pts.map(p=>'<div class="pt"><b>'+esc(p[0])+':</b> '+esc(p[1])+'</div>').join('')
    +'<div style="margin-top:8px"><b style="font-size:12px;color:var(--mut)">PRÓXIMAS AÇÕES SUGERIDAS</b>'+(o.sg.length?o.sg.map((s,i)=>linhaSug(s,c2.id,i)).join(''):'<div class="vazio">Sem sugestão: já há ação agendada.</div>')+'</div>'
    +'<div class="acoes" style="margin:8px 0 0"><button class="btn sm sec" data-a="conta-edit" data-id="'+c2.id+'">Abrir conta</button></div></div>'}).join(''):'<div class="card"><div class="vazio">Cadastre clientes potenciais na aba “Clientes potenciais” para gerar o relatório.</div></div>');

function textoRel(){

  'cal-prox':()=>{const m=U.cal.modo,r=parseYmd(U.cal.ref);if(m==='mes')r.setMonth(r.getMonth()+1);else r.setDate(r.getDate()+(m==='semana'?7:1));U.cal.ref=ymd(r);render()},
  'cal-hoje':()=>{U.cal.ref=hoje();render()},
  'cal-modo':d=>{U.cal.modo=d.m;render()},
  'cal-dia':d=>{U.cal.ref=d.d;U.cal.modo='dia';render()},
  'sug-nota':d=>{const a=porId(d.id);modalNota(null,{atvId:a.id,cliente:a.cliente,data:a.data})},
  'sug-follow':d=>{const a=porId(d.id);modalAtv(null,{tipo:'email_env',titulo:'Enviar resumo da visita — '+a.titulo,cliente:a.cliente,data:hoje()})},
  'sug-concluir':async d=>{const a=porId(d.id);a.status='concluida';a.concluidoEm=new Date().toISOString();tocar(a);await salvar();render()},
  'sug-hoje':async d=>{const a=porId(d.id);a.data=hoje();tocar(a);await salvar();render()},
  'sug-dispensar':async d=>{S.config.dispensadas[d.k]=true;await salvar();render()},
  'ia-organizar':()=>{const t=($('#at').value||'').trim();if(!t){toast('Escreva ou cole um texto primeiro');return}abreClaude(promptOrganizar(t))},
  'ia-sugerir':()=>{const t=($('#at').value||'').trim();if(!t){toast('Escreva ou cole um texto primeiro');return}abreClaude(promptSugerir(t))},
  'pasta-escolher':escolhePasta,'pasta-reativar':reativaPasta,
  'pasta-agora':async()=>{await gravaPasta();toast(dirErro?'Erro: '+dirErro:'Backup gravado');render()},
  'pasta-restaurar':()=>{if(confirm('Restaurar substitui os dados atuais pelos da pasta. Continuar?'))restauraPasta()},
  'exp':exportaManual,'imp':()=>$('#impf').click(),
  'ir-backup':()=>{U.tela='backup';render()},
  'drive-conectar':conectaDrive,
  'drive-sync':async()=>{try{await pedeTokenSeFalta()}catch(e){driveStatus='reconectar';atualizaBk();return}sincroniza()},
  'drive-desconectar':desconectaDrive,
  'drive-salvar-cid':async()=>{L.clientId=($('#cid').value||'').trim();await salvaL();token=null;tokenCid='';tokenCli=null;toast('Client ID salvo');render()}
};
document.addEventListener('click',e=>{
  if(L.driveOn&&driveStatus==='reconectar'&&!tokenPend&&!e.target.closest('[data-a="drive-conectar"]'))reautoriza();
  const nv=e.target.closest('[data-nav]');if(nv){U.tela=nv.dataset.nav;fechaModal();render();return}
  if(e.target.id==='ov'){fechaModal();return}
  const el=e.target.closest('[data-a]');if(!el||e.target.closest('.mod'))return;
  if(e.target.matches('input[data-a="done"]')){e.stopPropagation();ACOES.done(el.dataset);return}
  if(el.dataset.a==='edit'&&e.target.closest('[data-a="gcal"],[data-a="done"]'))return;
  const f=ACOES[el.dataset.a];if(f){e.stopPropagation();f(el.dataset)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechaModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);fila=fila.then(gravaPasta).catch(()=>{})}});

/* ---------- início ---------- */
(async function init(){
  try{await abreDB()}catch(e){$('#c').innerHTML='<div class="card">Este navegador não permite armazenamento local (IndexedDB). O app não funciona aqui.</div>';return}
  let carregado=false;try{const e=await kvGet('estado');if(e){S=normaliza(e);carregado=true}}catch(e){}
  try{Object.assign(L,(await kvGet('local'))||{})}catch(e){}
  await carregaHandle();
  if(carregado)try{const ids=new Set(S.atividades.map(a=>a.id));for(const x of await anexoAll()){if(!ids.has(x.atvId))await anexoDel(x.id)}}catch(e){}
  if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist()}catch(e){}}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  iniciaTema();
  render();
  window.__app={get S(){return S},render,gcalUrl,textoCRM,sugestoes,U,get L(){return L},get dirStatus(){return dirStatus},get driveStatus(){return driveStatus},mescla,sincroniza,expiraToken:()=>{token=null;tokenExp=0}};
  iniciaDrive();
})();
})();
</script>
</body>
